        - generic [ref=f91e282]:
          - generic [ref=f91e283]: ★★★★★
          - paragraph [ref=f91e284]: Огромное спасибо за невероятно крутой квест «Игра в кальмара»! Детям всё очень понравилось, они остались в полном восторге! Столько эмоций, азарта, веселья и незабываемых впечатлений! Всё было организовано на высшем уровне, ребята получили массу положительных эмоций и ещё долго делились своими впечатлениями. Спасибо организаторам за чудесный праздник, отличную атмосферу и подаренные детям счастливые моменты! Обязательно будем рекомендовать вас друзьям и с удовольствием придём ещё раз!
          - text: Таня Косякова
        - generic [ref=f91e285]:
          - generic [ref=f91e286]: ★★★★★
          - paragraph [ref=f91e287]: Праздновали день рождения сына. Остались довольны все и дети и родители. Потрясающая администратор, заняла детей несмотря на то что мы раньше пришли, всегда интересовалась нужно ли нам что-то. Ведущие без внимания ни одного ребенка не отставили. В интерьере продумано все до мелочей. Сын сказал в следующем году пойдем сюда снова. Тем более что у ребят меняется программа.
          - text: Екатерина Щ.
        - generic [ref=f91e288]:
          - generic [ref=f91e289]: ★★★★★
          - paragraph [ref=f91e290]: Очень крутое место, чтобы отметить день рождения ребенка! Атмосферно, две банкетных комнаты, большая стилизованная игровая! Актеры и администратор Елена — супер, очень приятные и отзывчивые. Детям очень понравилась игра! Спасибо
          - text: Таня А.
        - generic [ref=f91e291]:
          - generic [ref=f91e292]: ★★★★★
          - paragraph [ref=f91e293]: Отмечали день рождения ребенку 6.09. Хочу сказать спасибо организаторам. Все было на высшем уровне. Дети в восторге. Помещение очень чистое. Персонал приветливый. С удовольствием провели время. Если думаете где отметить день рождения ребенка, однозначно выбирайте этот квест.
          - text: Михаил К.
