window.cur.apiPrefetchCache = [{"method":"utils.resolveScreenName","request":{"screen_name":"xkalmar"},"version":"5.289","response":{"object_id":211055079,"type":"group"}},{"method":"groups.getById","request":{"fields":"is_member,member_status,is_closed,can_see_members,can_post,can_suggest,can_upload_video,can_upload_story,can_upload_clip,community_channel_id,leave_mode,enabled_features,cover,photo_avg_color,has_photo,crop_photo,tabs,main_album_id,can_message,is_government_organization,is_yclients_tooltip_active,verified,donut_block,donut_payment_info,friends,contacts,show_suggestions,has_suggestions,audio_curator_id,menu,is_group_displayed,is_messages_blocked,is_hidden_from_feed,is_subscribed,is_favorite,online_status,event_organizer,ban_info,videos_count,invited_by,audio_artist_id,deactivated_type,deactivated_message,age_mark,a_plus_mark,description,rating,phone,site,is_site_displayed,channel_button,is_business,addresses,start_date,finish_date,is_work_group,action_button,is_market_online_booking_action_button_enabled,is_market_cart_enabled,has_stories,warning_notification,is_event,status,category1_name,members_count,yclients_repeat_records,trust_mark,market,strikes_info,strikes_restrictions,market_shop_conditions_state,app_button,city,is_business_category,is_manual_marked_business,admin_level,channel_info,has_group_channel,wall,create_date,video_lives_data,primary_block,channel_block,content_sections_data,failed_status","group_ids":211055079},"version":"5.289","response":{"groups":[{"id":211055079,"description":"🎮 Квест‑шоу «Игра в кальмара» — погрузитесь в атмосферу культового сериала!\n\nПриглашаем вас и вашу команду на динамичное квест‑шоу по мотивам популярного сериала — теперь по сниженным ценам! \n\nУ нас — яркие испытания, профессиональные актёры и море эмоций без элементов хоррора. Идеально для дня рождения, выпускного, корпоратива или просто встречи с друзьями! 🥳\n\n🔥 Почему стоит выбрать нас?\n\n✅ Захватывающий формат: испытания по мотивам 1‑го и 2‑го сезонов сериала с адаптированными заданиями для разных возрастов.\n\n✅ Профессиональное сопровождение: 3 опытных актёра‑аниматора создают настоящую атмосферу шоу.\n\n✅ Просторная площадка: 240 кв. м с игровой зоной, банкетными комнатами и всеми удобствами.\n\n✅ Гибкие пакеты услуг: от компактного «Базового» до «Максимального» формата — теперь ещё доступнее!\n\n✅ Дополнительные опции: фото‑ и видеосъёмка, торт, гелиевые шары, кейтеринг и др.\n\n👥 Для кого подходит?\n\n◦ Команды от 6 до 30 человек (оптимальное количество 6-12, свыше — обсуждается индивидуально с организатором).\n\n◦ Возрастное ограничение: 7+.\n\n📍 Где мы находимся?\n\nАдрес: Ростов‑на‑Дону, ул. Зорге, д. 15 (вход с торца здания напротив бара «Эйнштейн»).\n\n🔌 Что есть на площадке:\n\n◦ Игровая зона (до 30 участников)\n◦ Две банкетные комнаты (на 20 и 17 посадочных мест)\n◦ Зона ожидания (6 мест)\n◦ Сплит‑системы и вентиляция\n◦ Кулер с питьевой водой\n◦ Два сан‑узла\n◦ Бытовая техника (чайник, микроволновка, холодильник)\n◦ Станция «Алиса»\n\n📌 Условия посещения\n\n◦ Одежда: удобная, подходящая для активных игр.\n\n◦ Обувь: обязательна сменная (для комфорта и безопасности).\n\n📅 Условия бронирования\n\n1️⃣ Предоплата: 3 000 ₽ (обязательна).\n\n2️⃣ Способы оплаты: карта, перевод, наличные, QR‑код.\n\n3️⃣ Возврат предоплаты: в любой день, кроме даты мероприятия.\n\n4️⃣ Оплата остатка: на мероприятии (за вычетом предоплаты).\n\n🕐 График работы:\n\n◦ В выходные (сб, вс) и праздники: сеансы с 10:00 до 22:00 с шагом 2 часа (10:00–12:00, 12:00–14:00 и так далее до 22:00).\n\n◦ В будние дни: гибкая сетка бронирования с 10:00 до 22:00 (подбираем удобное время индивидуально).\n\n◦ Бронирование: только по предварительной записи.\n\n💡 Что ещё важно знать?\n\n◦ На протяжении всего мероприятия вас курирует организатор: следит за таймингом, помогает с техническими вопросами и обеспечивает комфорт.\n\n◦ После бронирования мы подготовим электронное приглашение для ваших гостей.\n\n🎉 Не упустите шанс провести незабываем
